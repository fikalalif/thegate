name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (test pack & inspect without publishing)"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio aiosqlite httpx

      - name: Run Backend Tests
        env:
          THEGATE_ENV: testing
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m pytest tests/ -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend TypeScript
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

  publish:
    name: Publish Package to npm
    needs: validate
    runs-on: ubuntu-latest
    environment: NPM_TOKEN
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js for npm Publishing
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dry Run Publish
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public

      - name: Publish to npm Registry via Trusted Publishing
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance
