name: Publish to npm

on:
  release:
    types: [published]
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (test pack & inspect without publishing)"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Backend & Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Native Fastify Backend Tests
        run: npm test

      - name: Validate Frontend TypeScript
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

  build-and-publish:
    name: Build Bundle & Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js for npm Publishing
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Build Next.js Standalone Bundle
        working-directory: frontend
        run: |
          npm run build
          rm -rf .next/cache

      - name: Ensure Executable Permissions
        run: chmod +x bin/thegate.js

      - name: Dry Run Publish
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public

      - name: Publish to npm Registry
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          PUBLISHED_VER=$(npm view thegate@$CURRENT_VER version 2>/dev/null || echo "")

          if [ "$PUBLISHED_VER" = "$CURRENT_VER" ]; then
            echo "Version $CURRENT_VER is already published on npm. Skipping publication."
            exit 0
          fi

          echo "🚀 Publishing version $CURRENT_VER to npm..."
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public
          else
            npm publish --access public --provenance
          fi
