version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: thegate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thegate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thegate_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-thegate_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thegate} -d ${POSTGRES_DB:-thegate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thegate-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thegate-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
